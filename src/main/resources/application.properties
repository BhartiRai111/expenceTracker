spring.application.name=ExpensesTracker

# Secrets/config come from environment variables or a local .env file (see .env.example)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

twilio.sid=${TWILIO_SID:}
twilio.token=${TWILIO_TOKEN:}
twilio.phone=${TWILIO_PHONE:}

ai.api.key=${OPENAI_API_KEY:}
ai.model=${OPENAI_MODEL:gpt-4o-mini}
